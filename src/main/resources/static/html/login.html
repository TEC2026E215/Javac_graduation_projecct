<!DOCTYPE html>
<html lang="ja"> <!-- 言語を日本語に変更 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <title>学就</title>
</head>
<header>
    <div class="header-logo">
        <img id = "icon" src="../img/gakushu_icon.jpg" alt="学就">
        <!--<h1>学就</h1>-->
    </div>
</header>
<body>
    <div id="inputArea">
        <h2>ログイン</h2>
        <!-- 💡 修正ポイント①: actionを "/api/login" に、methodを "post" に変更 -->
        <form action="/api/login" method="post" class="form-example">
            <div>
                <label for="stuId">ID: </label>
                <!-- 💡 修正ポイント②: name属性を "username" に変更（Spring Securityのデフォルト） -->
                <input type="text" name="username" id="stuId" required />
            </div>
            <div>
                <label for="stuPassword">パスワード: </label>
                <!-- 💡 修正ポイント③: typeを "password" に（伏せ字）、nameを "password" に変更 -->
                <input type="password" name="password" id="stuPassword" required />
            </div>
            <!-- 💡 修正ポイント④: typeを "submit" に変更してフォーム送信ボタンにする -->
            <button id="loginBtn" type="submit">ログイン</button>
            <div>
                <h2 id="err"></h2>
            </div>
        </form>
    </div>
    <!-- ※通常のフォーム送信にする場合、login.jsでの通信処理は不要になります -->
    <script src="../js/login.js"></script>
</body>
</html>
