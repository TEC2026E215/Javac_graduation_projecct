<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/cd_booking.css">
    <title>キャリヤセンター予約</title>
</head>
<body>
    <header>
        <div class="header-logo">
            <img id="icon" src="../img/icon_kari.png" alt="学就">
            <h1>学就</h1>
        </div>
        <div class="header-button">
            <a href="main.html">
                <button class ="Btn" id="homeBtn">ホーム</button>
            </a>
            <a href="cs_booking.html">
                <button class ="Btn"id="checkBtn">CS予約</button>
            </a>
            <a href="review_post.html">
                <button class ="Btn"id="postBtn">体験談投稿</button>
            </a>
            <a href="">
                <button class ="Btn"id="postBtn">体験談一覧</button>
            </a>
            <a href="login.html">
                <button id="logoutBtn">ログアウト</button>
            </a>
        </div>
    </header>

    <h1>キャリヤセンター予約</h1>

    <div class="date-picker">
        <div class="calendar-container">
            <div class="calendar-header">
                <button class="nav-btn" id="prevBtn">◀</button>
                <h2 id="monthYear">2023/9</h2>
                <button class="nav-btn" id="nextBtn">▶</button>
            </div>
            
            <div class="calendar-grid">
                <div class="grid-item weekday">日</div>
                <div class="grid-item weekday">月</div>
                <div class="grid-item weekday">火</div>
                <div class="grid-item weekday">水</div>
                <div class="grid-item weekday">木</div>
                <div class="grid-item weekday">金</div>
                <div class="grid-item weekday">土</div>
                
                <div id="daysContainer" style="display: contents;"></div>
            </div>

            <div class="calendar-legend">
                <div class="legend-item"><span class="status-ok">○</span> 予約可</div>
                <div class="legend-item"><span class="status-ng">×</span> 予約不可</div>
            </div>
        </div>
    </div>

    <script src="../js/cs_booking.js"></script>
</body>
</html>
